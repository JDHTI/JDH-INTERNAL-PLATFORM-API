name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

# A PR's run is grouped by its number, never by github.ref: a pull_request event that arrives
# after the PR is merged carries refs/heads/master, and would cancel the master run (and its
# deploy, possibly between the migrations and the restart).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  # A push to master must not cancel a deploy halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/master' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # setup-python's Poetry cache calls the poetry executable while the
      # action is configuring the cache, so Poetry must be installed first.
      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: poetry
          cache-dependency-path: poetry.lock

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local

      - name: Validate lock file
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Lint
        run: poetry run ruff check .

      - name: Check formatting
        run: poetry run ruff format --check .

      - name: Run tests
        run: poetry run pytest -q

  # The runner lives on the intranet server and connects out to GitHub, so the server opens no
  # port for this. Setup: docs/deploy.md.
  deploy:
    name: Desplegar en intranet.jdh.com.co
    needs: [quality]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: [self-hosted, internal-platform-api]
    timeout-minutes: 30
    environment: produccion
    concurrency:
      group: deploy-platform-api
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Deploy
        run: bash deploy/deploy.sh
        env:
          GIT_SHA: ${{ github.sha }}
