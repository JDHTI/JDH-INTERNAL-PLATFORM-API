name: internal-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-internal_platform}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis}"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}

  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav:1.4.6}
    ports:
      - "127.0.0.1:${CLAMAV_HOST_PORT:-3310}:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  minio:
    image: quay.io/minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${S3_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        mc anonymous set private "local/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-internal-platform}
    restart: "no"

  migrate:
    build:
      context: .
      target: runtime
    command: ["poetry", "run", "alembic", "upgrade", "head"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-internal_platform}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["app"]

  api:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    environment:
      APP_NAME: ${APP_NAME:-Internal Platform API}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      DEBUG: ${DEBUG:-true}
      PORT: 8000
      API_PREFIX: ${API_PREFIX:-/api}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Explicit origins: SSO uses cookies, and credentialed CORS cannot use "*".
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ENTRA_API_AUDIENCE: ${ENTRA_API_AUDIENCE:-}
      ENTRA_API_SCOPE: ${ENTRA_API_SCOPE:-access_as_user}
      ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI:-http://localhost:8000/api/v1/auth/callback}
      AUTH_FRONTEND_REDIRECT_URI: ${AUTH_FRONTEND_REDIRECT_URI:-}
      AUTH_DEV_BYPASS: ${AUTH_DEV_BYPASS:-true}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-internal_platform}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis}@redis:6379/0
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-internal-platform}
      RATE_LIMIT_READ_REQUESTS: ${RATE_LIMIT_READ_REQUESTS:-600}
      RATE_LIMIT_READ_WINDOW_SECONDS: ${RATE_LIMIT_READ_WINDOW_SECONDS:-60}
      RATE_LIMIT_RELAXED_REQUESTS: ${RATE_LIMIT_RELAXED_REQUESTS:-120}
      RATE_LIMIT_RELAXED_WINDOW_SECONDS: ${RATE_LIMIT_RELAXED_WINDOW_SECONDS:-60}
      RATE_LIMIT_STRICT_REQUESTS: ${RATE_LIMIT_STRICT_REQUESTS:-5}
      RATE_LIMIT_STRICT_WINDOW_SECONDS: ${RATE_LIMIT_STRICT_WINDOW_SECONDS:-600}
      RATE_LIMIT_TRUSTED_PROXY_IPS: ${RATE_LIMIT_TRUSTED_PROXY_IPS:-}
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-internal-platform}
      AUTH_MICROSOFT_ENTRA_ID_SECRET: ${AUTH_MICROSOFT_ENTRA_ID_SECRET:-}
      AUTH_MICROSOFT_ENTRA_ID_ID: ${AUTH_MICROSOFT_ENTRA_ID_ID:-}
      AUTH_MICROSOFT_ENTRA_ID_TENANT_ID: ${AUTH_MICROSOFT_ENTRA_ID_TENANT_ID:-}
      DWH_ENABLED: ${DWH_ENABLED:-true}
      DWH_PROVIDER: ${DWH_PROVIDER:-postgres}
      DWH_HOST: ${DWH_HOST:-}
      DWH_PORT: ${DWH_PORT:-5432}
      DWH_DATABASE: ${DWH_DATABASE:-}
      DWH_USER: ${DWH_USER:-}
      DWH_PASSWORD: ${DWH_PASSWORD:-}
      DWH_SCHEMA: ${DWH_SCHEMA:-consumo}
      DWH_CLIENTS_VIEW: ${DWH_CLIENTS_VIEW:-clientes}
      DWH_POOL_MIN_SIZE: ${DWH_POOL_MIN_SIZE:-1}
      DWH_POOL_MAX_SIZE: ${DWH_POOL_MAX_SIZE:-5}
      DWH_CONNECT_TIMEOUT_SECONDS: ${DWH_CONNECT_TIMEOUT_SECONDS:-2}
      DWH_COMMAND_TIMEOUT_SECONDS: ${DWH_COMMAND_TIMEOUT_SECONDS:-10}
      DWH_CURSOR_SECRET: ${DWH_CURSOR_SECRET:-}
      # The API reaches minio:9000; the browser reaches the published port, and
      # the download signature covers the host.
      S3_PUBLIC_ENDPOINT_URL: http://localhost:${S3_HOST_PORT:-9000}
      DOCUMENTS_MAX_UPLOAD_MB: ${DOCUMENTS_MAX_UPLOAD_MB:-25}
      PQRSF_MAX_ATTACHMENTS: ${PQRSF_MAX_ATTACHMENTS:-5}
      PQRSF_MAX_ATTACHMENT_MB: ${PQRSF_MAX_ATTACHMENT_MB:-5}
      PQRSF_MAX_TOTAL_ATTACHMENT_MB: ${PQRSF_MAX_TOTAL_ATTACHMENT_MB:-25}
      PQRSF_MAX_IMAGE_PIXELS: ${PQRSF_MAX_IMAGE_PIXELS:-20000000}
      PQRSF_MAX_VIDEOS: ${PQRSF_MAX_VIDEOS:-1}
      PQRSF_MAX_VIDEO_MB: ${PQRSF_MAX_VIDEO_MB:-20}
      PUBLIC_MAX_BODY_MB: ${PUBLIC_MAX_BODY_MB:-50}
      PQRSF_CLAMAV_HOST: ${PQRSF_CLAMAV_HOST:-clamav}
      PQRSF_CLAMAV_PORT: ${PQRSF_CLAMAV_PORT:-3310}
      PQRSF_CLAMAV_TIMEOUT_SECONDS: ${PQRSF_CLAMAV_TIMEOUT_SECONDS:-10}
      PRODUCT_MARGINS_MAX_UPLOAD_MB: ${PRODUCT_MARGINS_MAX_UPLOAD_MB:-20}
      SUPPLIER_SUPPORTS_MANAGER_AREA_SLUG: ${SUPPLIER_SUPPORTS_MANAGER_AREA_SLUG:-comercial}
      SUPPLIER_SUPPORTS_DOCUMENTS_AREA_SLUG: ${SUPPLIER_SUPPORTS_DOCUMENTS_AREA_SLUG:-bi}
      SUPPLIER_SUPPORTS_DOCUMENTS_FOLDER: ${SUPPLIER_SUPPORTS_DOCUMENTS_FOLDER:-soporte_apoyos}
      PQRSF_MANAGER_AREA_SLUG: ${PQRSF_MANAGER_AREA_SLUG:-calidad}
      PQRSF_TIMEZONE: ${PQRSF_TIMEZONE:-America/Bogota}
      PQRSF_HOLIDAYS_COUNTRY: ${PQRSF_HOLIDAYS_COUNTRY:-CO}
      PQRSF_HOLIDAYS_API_URL: ${PQRSF_HOLIDAYS_API_URL:-https://date.nager.at/api/v3}
      PQRSF_NOTIFICATIONS_ENABLED: ${PQRSF_NOTIFICATIONS_ENABLED:-false}
      PQRSF_UI_BASE_URL: ${PQRSF_UI_BASE_URL:-http://localhost:3000}
      PQRSF_NOTIFY_REDIRECT: ${PQRSF_NOTIFY_REDIRECT:-}
      PQRSF_FEEDBACK_REPLIES_PER_EMAIL_PER_DAY: ${PQRSF_FEEDBACK_REPLIES_PER_EMAIL_PER_DAY:-3}
      PQRSF_CERTIFICATES_AREA_SLUG: ${PQRSF_CERTIFICATES_AREA_SLUG:-calidad}
      PQRSF_DOCUMENT_EMAILS_PER_ADDRESS_PER_DAY: ${PQRSF_DOCUMENT_EMAILS_PER_ADDRESS_PER_DAY:-5}
      PQRSF_DOCUMENT_EMAIL_MAX_MB: ${PQRSF_DOCUMENT_EMAIL_MAX_MB:-15}
      # PQRSF mailbox through Microsoft Graph (separate app registration from SSO).
      MAIL_INTAKE_ENABLED: ${MAIL_INTAKE_ENABLED:-false}
      MAIL_GRAPH_TENANT_ID: ${MAIL_GRAPH_TENANT_ID:-}
      MAIL_GRAPH_CLIENT_ID: ${MAIL_GRAPH_CLIENT_ID:-}
      MAIL_GRAPH_CLIENT_SECRET: ${MAIL_GRAPH_CLIENT_SECRET:-}
      MAIL_PQRSF_INBOX: ${MAIL_PQRSF_INBOX:-pqrsf@jdh.com.co}
      MAIL_IGNORED_SENDERS: ${MAIL_IGNORED_SENDERS:-info@jdh.com.co}
      MAIL_INTAKE_SINCE: ${MAIL_INTAKE_SINCE:-}
      MAIL_POLL_INTERVAL_SECONDS: ${MAIL_POLL_INTERVAL_SECONDS:-120}
      MAIL_MAX_ATTEMPTS: ${MAIL_MAX_ATTEMPTS:-5}
      MAIL_MAX_ATTACHMENTS: ${MAIL_MAX_ATTACHMENTS:-10}
      MAIL_MAX_ATTACHMENT_MB: ${MAIL_MAX_ATTACHMENT_MB:-10}
      MAIL_MAX_TOTAL_ATTACHMENT_MB: ${MAIL_MAX_TOTAL_ATTACHMENT_MB:-25}
      MAIL_ATTACHMENT_EXTENSIONS: ${MAIL_ATTACHMENT_EXTENSIONS:-pdf,doc,docx,xls,xlsx,csv,txt,ppt,pptx,png,jpg,jpeg,webp}
      ORDER_VALIDATION_MANAGER_AREA_SLUG: ${ORDER_VALIDATION_MANAGER_AREA_SLUG:-comercial}
      ORDER_VALIDATION_MAX_UPLOAD_MB: ${ORDER_VALIDATION_MAX_UPLOAD_MB:-10}
      ORDER_VALIDATION_MAX_LINES: ${ORDER_VALIDATION_MAX_LINES:-10000}
      ORDER_VALIDATION_MAX_POINTS_BELOW_TARGET: ${ORDER_VALIDATION_MAX_POINTS_BELOW_TARGET:-4}
      ORDER_VALIDATION_TOLERANCE_MIN_ORDER_MARGIN: ${ORDER_VALIDATION_TOLERANCE_MIN_ORDER_MARGIN:-18}
      ORDER_VALIDATION_TOLERANCE_MAX_LINES: ${ORDER_VALIDATION_TOLERANCE_MAX_LINES:-2}
      # Data warehouse monitoring: copies the monitoreo schema over the DWH_* connection.
      DWH_MONITORING_SYNC_ENABLED: ${DWH_MONITORING_SYNC_ENABLED:-false}
      DWH_MONITORING_SYNC_INTERVAL_SECONDS: ${DWH_MONITORING_SYNC_INTERVAL_SECONDS:-600}
      # Application monitoring: health endpoint and UI of every registered platform.
      APP_MONITORING_ENABLED: ${APP_MONITORING_ENABLED:-true}
      APP_MONITORING_INTERVAL_SECONDS: ${APP_MONITORING_INTERVAL_SECONDS:-60}
      APP_MONITORING_RETENTION_DAYS: ${APP_MONITORING_RETENTION_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    profiles: ["app"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:
