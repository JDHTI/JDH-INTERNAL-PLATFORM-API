[project]
name = "internal-platform-api"
version = "0.1.0"
description = "Modular FastAPI foundation for Internal Platform"
authors = [
    { name = "Internal Platform Team" }
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "dependency-injector>=4.45,<5.0",
    "colorlog>=6.8,<7.0",
    "python-dotenv>=1.0,<2.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "redis>=5.0,<7.0",
    "boto3>=1.35,<2.0",
    "httpx>=0.27,<1.0",
    "pyjwt[crypto]>=2.9,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "email-validator>=2.2,<3.0",
    "Pillow>=10.4,<12.0",
    "holidays (>=0.105,<0.106)",
    "tzdata (>=2026.4,<2027.0)",
    "openpyxl (>=3.1,<4.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<10.0"
pytest-asyncio = ">=0.23,<2.0"
pytest-cov = ">=5.0,<8.0"
ruff = ">=0.6,<1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
# PLC0415: every import goes at the top of the file, never inside a function.
select = ["E", "F", "I", "B", "UP", "PLC0415"]

[tool.ruff.lint.isort]
# Imports are grouped as: standard library, third-party packages, then our own code
# (``app`` and ``tests``), each group separated by a blank line.
known-first-party = ["app", "tests"]
# The ``alembic/`` folder of this repo shares its name with the migration library.
known-third-party = ["alembic"]

[tool.ruff.format]
quote-style = "double"
